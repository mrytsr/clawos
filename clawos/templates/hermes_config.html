<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Config</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/lib/codemirror/codemirror.min.css">
    <link rel="stylesheet" href="/static/lib/codemirror/theme/dracula.min.css">
    <script src="/static/lib/codemirror/codemirror.min.js"></script>
    <script src="/static/lib/codemirror/mode/yaml/yaml.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/globals.js"></script>
    <script src="/static/js/task_poller.js"></script>
    <script src="/static/js/hermes_config.js"></script>
</head>
<body style="padding:20px;">
    <div class="container" style="height:calc(100vh - 40px);">
        <div class="breadcrumb" style="position:sticky;top:0;z-index:10;">
            <div class="breadcrumb-left" style="gap:10px;">
                <a href="/" style="text-decoration:none;">Back</a>
                <span style="font-weight:600;">Hermes</span>
            </div>
            <div class="breadcrumb-right" style="gap:10px;">
                <button id="hermesInstallBtn" style="display:none;background:#2da44e;border:none;border-radius:6px;color:#fff;padding:6px 10px;cursor:pointer;font-size:13px;">安装</button>
                <button id="hermesUninstallBtn" style="display:none;background:#cf222e;border:none;border-radius:6px;color:#fff;padding:6px 10px;cursor:pointer;font-size:13px;">卸载</button>
                <button id="hermesReloadBtn" style="background:none;border:1px solid #d0d7de;border-radius:8px;font-size:16px;cursor:pointer;padding:6px 10px;" title="Refresh">🔄</button>
                <button id="hermesSaveBtn" style="background:#0969da;border:none;border-radius:6px;color:#fff;padding:6px 10px;cursor:pointer;font-size:13px;">保存 YAML</button>
            </div>
        </div>

        <div class="bot-container" style="flex:1;min-height:0;position:relative;">
            <div style="display:flex;border-bottom:1px solid #d0d7de;background:#f6f8fa;">
                <button class="bot-tab active" data-tab="config" onclick="switchHermesTab('config')" style="flex:1;padding:10px;border:none;background:transparent;font-size:13px;color:#57606a;cursor:pointer;border-bottom:2px solid transparent;">设置</button>
                <button class="bot-tab" data-tab="models" onclick="switchHermesTab('models')" style="flex:1;padding:10px;border:none;background:transparent;font-size:13px;color:#57606a;cursor:pointer;border-bottom:2px solid transparent;">Models</button>
                <button class="bot-tab" data-tab="toolsets" onclick="switchHermesTab('toolsets')" style="flex:1;padding:10px;border:none;background:transparent;font-size:13px;color:#57606a;cursor:pointer;border-bottom:2px solid transparent;">Toolsets</button>
                <button class="bot-tab" data-tab="chat" onclick="switchHermesTab('chat')" style="flex:1;padding:10px;border:none;background:transparent;font-size:13px;color:#57606a;cursor:pointer;border-bottom:2px solid transparent;">对话</button>
                <button class="bot-tab" data-tab="yaml" onclick="switchHermesTab('yaml')" style="flex:1;padding:10px;border:none;background:transparent;font-size:13px;color:#57606a;cursor:pointer;border-bottom:2px solid transparent;">YAML</button>
            </div>

            <div id="hermesConfigPanel" style="display:block;overflow-y:auto;flex:1;min-height:0;padding:16px;">
                <div id="hermesConfigContainer"></div>
            </div>

            <div id="hermesModelsPanel" style="display:none;overflow-y:auto;flex:1;min-height:0;padding:16px;">
                <div id="hermesModelsContainer"></div>
            </div>

            <div id="hermesToolsetsPanel" style="display:none;overflow-y:auto;flex:1;min-height:0;padding:16px;">
                <div id="hermesToolsetsContainer"></div>
            </div>

            <div id="hermesChatPanel" style="display:none;overflow-y:auto;flex:1;min-height:0;padding:16px;">
                <div id="hermesChatContainer"></div>
            </div>

            <div id="hermesYamlPanel" style="display:none;overflow:hidden;flex:1;min-height:0;padding:16px;">
                <div style="height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid #d0d7de;border-radius:8px;overflow:hidden;">
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #d8dee4;">
                        <div style="font-size:13px;font-weight:600;">`~/.hermes/config.yaml`</div>
                        <div id="hermesEditorMeta" style="font-size:12px;color:#57606a;"></div>
                    </div>
                    <textarea id="hermesConfigEditor"></textarea>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
